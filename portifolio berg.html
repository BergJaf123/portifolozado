<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Portfólio</title>
<style>
  :root{
    --cor-fundo: #000;
    --cor-texto: #f5f5f5;
    --cor-texto-suave: #aaa;
    --cor-primaria: #4fd18f;
    --cor-cartao: #1a1a1a;
    --cor-borda: #333;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    line-height: 1.5;
  }

  /* HEADER com Flexbox */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    background: var(--cor-cartao);
    border-bottom: 1px solid var(--cor-borda);
    padding: 16px 24px;
  }

  header h1 {
    font-size: 1.3rem;
    color: var(--cor-primaria);
  }

  header nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
  }

  header nav a {
    text-decoration: none;
    color: var(--cor-texto);
  }

  header nav a:hover {
    color: var(--cor-primaria);
  }

  /* SEÇÕES */
  section {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  section h2 {
    margin-bottom: 20px;
  }

  /* GRID de projetos */
  #projetos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  @media (max-width: 800px) {
    #projetos-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 500px) {
    #projetos-grid {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: var(--cor-cartao);
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    padding: 16px;
  }

  .card h3 {
    margin-bottom: 8px;
    color: var(--cor-primaria);
  }

  .card p {
    color: var(--cor-texto-suave);
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  .card a {
    color: var(--cor-primaria);
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--cor-texto-suave);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>Meu Portfólio</h1>
  <nav>
    <ul>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#projetos">Projetos</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="sobre">
    <h2>Sobre mim</h2>
    <p>Olá! Sou desenvolvedor(a) e este é meu portfólio de projetos.</p>
  </section>

  <section id="projetos">
    <h2>Projetos</h2>
    <div id="projetos-grid"></div>
  </section>
</main>

<footer>
  <p>&copy; 2026 - Meu Portfólio</p>
</footer>

<script>
  // Array de projetos
  const projetos = [
    {
      titulo: "Classificador de Imagens",
      descricao: "Rede neural para classificar imagens em categorias.",
      link: "#"
    },
    {
      titulo: "Chatbot",
      descricao: "Assistente de conversação usando API de linguagem.",
      link: "#"
    },
    {
      titulo: "Dashboard de Dados",
      descricao: "Painel com gráficos e filtros para visualizar dados.",
      link: "#"
    }
  ];

  // Renderiza os cards no DOM
  const grid = document.getElementById("projetos-grid");

  grid.innerHTML = projetos.map(p => `
    <div class="card">
      <h3>${p.titulo}</h3>
      <p>${p.descricao}</p>
      <a href="${p.link}">Ver projeto →</a>
    </div>
  `).join("");
</script>

</body>
</html>
